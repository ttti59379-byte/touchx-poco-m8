
name: Build TouchX 10x APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TouchX 10x
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project archive
        run: |
          ARCHIVE="TouchX_10x_repo.zip.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Archive not found!"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

      - name: Locate Gradle project
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo "Project: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p output

          find "$PROJECT_DIR" -type f -name "*.apk" \
            -exec cp {} output/ \;

          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchX-10x-APK
          path: output/*.apk
          if-no-files-found: error
          
