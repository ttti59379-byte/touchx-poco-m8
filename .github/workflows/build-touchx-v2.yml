
name: Build TouchX 10x V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip apktool

      - name: Find project ZIP
        run: |
          ARCHIVE=$(find . -type f \
            -name 'TouchX_10x_repo_v2.zip' | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: TouchX_10x_repo_v2.zip not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Found: $ARCHIVE"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          find extracted -maxdepth 4 -type f | head -n 200

      - name: Detect build system
        id: detect
        run: |
          if find extracted -type f -name gradlew | grep -q .; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
          elif find extracted -type f -name apktool.yml | grep -q .; then
            echo "type=apktool" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle and APKTool projects not found."
            exit 1
          fi

      - name: Build with Gradle
        if: steps.detect.outputs.type == 'gradle'
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build with APKTool
        if: steps.detect.outputs.type == 'apktool'
        run: |
          PROJECT=$(find extracted -type f -name apktool.yml | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT")
          apktool b "$PROJECT_DIR" \
            -o "$GITHUB_WORKSPACE/TouchX-unsigned.apk"

      - name: Collect APK
        run: |
          mkdir -p output

          find extracted -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -exec cp {} output/ \;

          if [ -f TouchX-unsigned.apk ]; then
            cp TouchX-unsigned.apk output/
          fi

          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchX-10x-V2
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
          
