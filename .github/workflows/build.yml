
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TouchX_10x_repo_v3.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="TouchX_10x_repo_v3.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Archive not found: $ARCHIVE"
            exit 1
          fi

          mkdir extracted

          python3 - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path("extracted").resolve()

          with zipfile.ZipFile("TouchX_10x_repo_v3.zip") as archive:
              for item in archive.infolist():
                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe ZIP path: " + name)

                  target = root.joinpath(*path.parts)

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(item) as src:
                          target.write_bytes(src.read())

          manifests = list(root.rglob("AndroidManifest.xml"))

          if len(manifests) != 1:
              raise SystemExit(
                  f"Expected one manifest, found {len(manifests)}"
              )

          app = manifests[0].parent

          required = [
              "AndroidManifest.xml",
              "resources.arsc",
              "classes.dex",
              "classes2.dex",
              "classes3.dex"
          ]

          for name in required:
              if not (app / name).is_file():
                  raise SystemExit("Missing: " + name)

          if not (app / "res").is_dir():
              raise SystemExit("Missing res directory")

          print("APK files found:")
          for item in sorted(app.rglob("*")):
              if item.is_file():
                  print(item.relative_to(app))

          with open("app_path.txt", "w") as f:
              f.write(str(app))
          PY

      - name: Verify DEX integrity
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat app_path.txt)"

          python3 - "$APP" <<'PY'
          import sys
          import hashlib
          import struct
          import zlib
          from pathlib import Path

          app = Path(sys.argv[1])

          for dex in sorted(app.glob("classes*.dex")):
              data = dex.read_bytes()

              if len(data) < 112 or not data.startswith(b"dex\n"):
                  raise SystemExit("Invalid DEX: " + dex.name)

              if struct.unpack("<I", data[32:36])[0] != len(data):
                  raise SystemExit("Invalid DEX size: " + dex.name)

              if data[12:32] != hashlib.sha1(data[32:]).digest():
                  raise SystemExit("Invalid DEX SHA-1: " + dex.name)

              checksum = struct.unpack("<I", data[8:12])[0]
              if checksum != (zlib.adler32(data[12:]) & 0xffffffff):
                  raise SystemExit("Invalid DEX checksum: " + dex.name)

              print(dex.name, "OK")
          PY

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat app_path.txt)"

          python3 - "$APP" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          app = Path(sys.argv[1])

          with zipfile.ZipFile(
              "unsigned.apk",
              "w",
              compression=zipfile.ZIP_STORED
          ) as apk:
              for item in sorted(app.rglob("*")):
                  if item.is_file():
                      apk.write(
                          item,
                          item.relative_to(app).as_posix()
                      )

          print("APK package created")
          PY

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BT/zipalign" -c -v 4 aligned.apk

      - name: Verify package ID
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/35.0.0"

          PACKAGE=$("$BT/aapt2" dump packagename aligned.apk)

          echo "Package: $PACKAGE"

          if [ "$PACKAGE" != "com.touchx.sensitivix8" ]; then
            echo "ERROR: Incorrect package ID"
            exit 1
          fi

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > signing.keystore

          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/apksigner" sign \
            --ks signing.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out TouchX_10x.apk \
            aligned.apk

          "$BT/apksigner" verify --verbose TouchX_10x.apk

          rm -f signing.keystore

      - name: Check output
        run: |
          set -euo pipefail

          test -s TouchX_10x.apk

          echo "Final APK:"
          ls -lh TouchX_10x.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchX_10x
          path: TouchX_10x.apk
          if-no-files-found: error
          
