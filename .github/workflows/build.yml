
name: Build TouchX 10x APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find preinstalled Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "ERROR: Android SDK Build Tools not found"
            exit 1
          fi

          BUILD_TOOLS="$(find "$SDK/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: No Build Tools installed"
            exit 1
          fi

          for tool in aapt zipalign apksigner; do
            test -x "$BUILD_TOOLS/$tool"
          done

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Using: $BUILD_TOOLS"

      - name: Find and validate application files
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f \
            -name 'TouchX_10x_repo_v3.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TouchX ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          mapfile -t MANIFESTS < <(
            find extracted -type f -name AndroidManifest.xml
          )

          if [ "${#MANIFESTS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one AndroidManifest.xml"
            exit 1
          fi

          APP_DIR="$(dirname "${MANIFESTS[0]}")"

          test -d "$APP_DIR/res"
          test -f "$APP_DIR/resources.arsc"
          test -s "$APP_DIR/classes.dex"
          test -s "$APP_DIR/classes2.dex"
          test -s "$APP_DIR/classes3.dex"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Application files found"

      - name: Validate DEX files
        shell: bash
        run: |
          set -euo pipefail

          for dex in classes.dex classes2.dex classes3.dex; do
            FILE="$APP_DIR/$dex"

            if [ "$(head -c 3 "$FILE")" != "dex" ]; then
              echo "ERROR: Invalid DEX file: $dex"
              exit 1
            fi

            echo "$dex OK"
          done

      - name: Create unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile

          app_dir = os.environ["APP_DIR"]

          with zipfile.ZipFile("unsigned.apk", "w") as apk:
              for root, dirs, files in os.walk(app_dir):
                  dirs.sort()
                  files.sort()

                  for filename in files:
                      full_path = os.path.join(root, filename)
                      relative_path = os.path.relpath(full_path, app_dir)

                      apk.write(
                          full_path,
                          relative_path.replace(os.sep, "/"),
                          compress_type=zipfile.ZIP_STORED
                      )

          print("Unsigned APK created")
          PY

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk

      - name: Verify package name
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$("$BUILD_TOOLS/aapt" dump badging aligned.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"

          echo "Detected package: $PACKAGE"

          if [ "$PACKAGE" != "com.touchx.sensitivix8" ]; then
            echo "ERROR: Incorrect package name"
            exit 1
          fi

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > signing.keystore

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out TouchX_10x.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose TouchX_10x.apk

          rm -f signing.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TouchX-10x-APK
          path: TouchX_10x.apk
          if-no-files-found: error
          
