
name: Build TouchX 10x APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          sdkmanager "build-tools;35.0.0" --verbose
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Find and validate application files
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -name 'TouchX_10x_repo_v3.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TouchX_10x_repo_v3.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          mapfile -t MANIFESTS < <(find extracted -type f -name AndroidManifest.xml)

          if [ "${#MANIFESTS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one AndroidManifest.xml"
            exit 1
          fi

          APP_DIR="$(dirname "${MANIFESTS[0]}")"

          test -d "$APP_DIR/res"
          test -f "$APP_DIR/resources.arsc"
          test -f "$APP_DIR/classes.dex"
          test -f "$APP_DIR/classes2.dex"
          test -f "$APP_DIR/classes3.dex"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Application files found successfully"

      - name: Validate DEX files
        shell: bash
        run: |
          set -euo pipefail

          for dex in classes.dex classes2.dex classes3.dex; do
            FILE="$APP_DIR/$dex"

            if [ ! -s "$FILE" ]; then
              echo "ERROR: $dex is missing or empty"
              exit 1
            fi

            if [ "$(head -c 4 "$FILE")" != "dex"$(printf '\n') ]; then
              echo "ERROR: Invalid DEX file: $dex"
              exit 1
            fi

            echo "$dex OK"
          done

      - name: Create unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile

          app_dir = os.environ["APP_DIR"]

          with zipfile.ZipFile("unsigned.apk", "w") as apk:
              for root, dirs, files in os.walk(app_dir):
                  dirs.sort()
                  files.sort()

                  for filename in files:
                      full_path = os.path.join(root, filename)
                      relative_path = os.path.relpath(full_path, app_dir)
                      apk.write(
                          full_path,
                          relative_path.replace(os.sep, "/"),
                          compress_type=zipfile.ZIP_STORED
                      )

          print("APK archive created")
          PY

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -p 4 unsigned.apk aligned.apk

      - name: Check package name
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging aligned.apk | head -n 1

          PACKAGE="$("$AAPT" dump badging aligned.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"

          if [ "$PACKAGE" != "com.touchx.sensitivix8" ]; then
            echo "ERROR: Incorrect package name: $PACKAGE"
            exit 1
          fi

          echo "Package name verified"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > signing.keystore

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out TouchX_10x.apk \
            aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose TouchX_10x.apk

          rm -f signing.keystore

      - name: Upload finished APK
        uses: actions/upload-artifact@v6
        with:
          name: TouchX-10x-APK
          path: TouchX_10x.apk
          if-no-files-found: error
          
